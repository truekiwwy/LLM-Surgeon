[package]
name = "surgeon-gui"
version = "0.1.0"
edition = "2021"
description = "Native viewer of the weight-surgeon graph: 3D layouts, baseline diff, live GraphPatch streams and backend setup"
repository = "https://github.com/truekiwwy/LLM-Surgeon"
readme = "README.md"
keywords = ["llm", "safetensors", "egui", "visualization", "graph"]
categories = ["visualization", "gui"]

[[bin]]
name = "surgeon-gui"
path = "src/main.rs"

# A member of the root workspace (one Cargo.lock): the GUI stack (winit, wayland, glutin) never
# enters the engine's own tree, which tests/deps_purity.rs checks.
[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
# glow (OpenGL) rather than wgpu: no Metal / Vulkan SDK crates, painting is 2D anyway.
eframe = { version = "0.36.2", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
# Already in this lockfile through weight-surgeon (same versions): docs/GUI_DEPENDENCIES.md.
schemars = { version = "0.8", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Installer and first-run wizard: every item is justified in docs/GUI_DEPENDENCIES.md.
sha2 = "0.11.1"
png = "0.18"
zip = { version = "9", default-features = false, features = ["deflate"] }
# Free disk space before a working copy, and whether a project lock's process is alive.
sysinfo = { version = "0.40.1", default-features = false, features = ["disk", "system"] }
weight-surgeon = { path = "../.." }

# TLS: the Windows system stack (schannel: system trust store, no C build) there, rustls
# elsewhere. `ureq` is the only HTTP client of the GUI; it never runs in the engine crate.
[target.'cfg(windows)'.dependencies]
ureq = { version = "3", default-features = false, features = ["native-tls"] }
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_Foundation", "Win32_Security_Credentials"] }
# The system picker of the source model (a weights file or a folder). Windows only: elsewhere
# rfd needs GTK or a desktop portal, and the path field stays.
rfd = { version = "0.18", default-features = false }

[target.'cfg(not(windows))'.dependencies]
ureq = { version = "3", default-features = false, features = ["rustls"] }

# The engine's in-process mistral.rs (off by default, see the root manifest).
[features]
mistralrs = ["weight-surgeon/mistralrs"]
cuda = ["weight-surgeon/cuda"]
metal = ["weight-surgeon/metal"]

[build-dependencies]
embed-resource = "3"

[dev-dependencies]
tempfile = "3.27.0"
# The mini Qwen2 of examples/make_fake_qwen2.rs (same version and features as the engine).
tokenizers = { version = "0.23.2", default-features = false, features = ["unstable_wasm"] }

# Distribution binary: `[profile.dist]` of the root manifest (fat LTO, strip).
