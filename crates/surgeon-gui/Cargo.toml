[package]
name = "surgeon-gui"
version = "0.1.0"
edition = "2021"
description = "Native viewer of the weight-surgeon graph: 3D layouts, baseline diff, live GraphPatch streams and backend setup"
repository = "https://github.com/truekiwwy/LLM-Surgeon"
readme = "README.md"
keywords = ["llm", "safetensors", "egui", "visualization", "graph"]
categories = ["visualization", "gui"]

[[bin]]
name = "surgeon-gui"
path = "src/main.rs"

# A crate of its own with its own Cargo.lock, like crates/surgeon-tui: the GUI stack (winit,
# wayland, glutin) never enters the root lockfile that tests/deps_purity.rs checks.
[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
# glow (OpenGL) rather than wgpu: no Metal / Vulkan SDK crates, painting is 2D anyway.
eframe = { version = "0.36.2", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
# Already in this lockfile through weight-surgeon (same versions): docs/GUI_DEPENDENCIES.md.
schemars = { version = "0.8", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Free disk space before a working copy, and whether a project lock's process is alive.
sysinfo = { version = "0.40.1", default-features = false, features = ["disk", "system"] }
weight-surgeon = { path = "../.." }

[dev-dependencies]
tempfile = "3.27.0"
# The mini Qwen2 of examples/make_fake_qwen2.rs (same version and features as the engine).
tokenizers = { version = "0.23.2", default-features = false, features = ["unstable_wasm"] }
