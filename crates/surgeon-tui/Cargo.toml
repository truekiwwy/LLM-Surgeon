[package]
name = "surgeon-tui"
version = "0.1.0"
edition = "2021"
description = "Fast terminal inspector for LLM weight topology (Safetensors/GGUF), with an IPC bridge for AI coding agents"
repository = "https://github.com/truekiwwy/LLM-Surgeon"
readme = "README.md"
keywords = ["llm", "safetensors", "gguf", "tui", "ratatui"]
categories = ["command-line-utilities", "visualization"]

[[bin]]
name = "surgeon-tui"
path = "src/main.rs"

[dependencies]
crossterm = { version = "0.29.0", features = ["event-stream"] }
half = { version = "2.7.1", features = ["std"] }
memmap2 = "0.9.12"
clap = { version = "4.6.7", features = ["derive"] }
futures-util = { version = "0.3.31", default-features = false, features = ["std"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
rayon = "1.12.0"
safetensors = "0.8.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.48.0", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "sync",
    "time",
] }
unicode-width = "0.2.3"

[dev-dependencies]
tempfile = "3.27.0"
