[package]
name = "weight-surgeon"
version = "0.1.0"
edition = "2021"
description = "Inspect, patch, evaluate and steer the MLP weights of local LLMs (SafeTensors), with a CLI, an MCP server and a terminal dashboard"
repository = "https://github.com/truekiwwy/LLM-Surgeon"
readme = "README.md"
keywords = ["llm", "safetensors", "steering", "mcp", "tui"]
categories = ["command-line-utilities", "science"]

[[bin]]
name = "surgeon"
path = "src/main.rs"

[dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
candle-core = { version = "0.11.1", default-features = false }
candle-nn = { version = "0.11.1", default-features = false }
clap = { version = "4.6.7", features = ["derive", "env"] }
ctrlc = "3.5.2"
half = { version = "2.7.1", features = ["std"] }
memmap2 = "0.9.12"
miniz_oxide = "0.8"
nvml-wrapper = "0.13.0"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache"] }
rayon = "1.12.0"
# Already in the graph through tokenizers (same version, default features): no new crate.
regex = "1.13.1"
safetensors = "0.8.0"
schemars = { version = "0.8", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
# float_roundtrip: a graph.json read back by `graph --baseline` gives the exact f64 that was
# written, so an identity diff is exactly zero (a parsing feature, no new crate).
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
sha2 = "0.11.1"
sysinfo = { version = "0.40.1", default-features = false, features = ["system"] }
thiserror = "2.0.21"
tokenizers = { version = "0.23.2", default-features = false, features = ["unstable_wasm"] }
unicode-width = "0.2.3"

# OS bindings for src/kernel only (declarations, nothing compiled from C). Both versions
# are already in Cargo.lock through other crates.
[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

[dev-dependencies]
candle-transformers = { version = "0.11.1", default-features = false }
jsonschema = { version = "0.61.0", default-features = false }
tempfile = "3.27.0"

# gemm-f16 (through candle-core) keeps its FP16 inline assembly in #[inline] helpers of
# gemm-common, which only assemble once inlined into functions that enable `fp16`. Without
# optimization they are not, and debug builds (`cargo test`) fail on aarch64 Linux with
# "instruction requires: fullfp16" (sarah-quinones/gemm#31). Release builds are unaffected,
# and no target feature is forced: binaries keep the generic aarch64 baseline.
[profile.dev.package.gemm-common]
opt-level = 3

[profile.dev.package.gemm-f16]
opt-level = 3
