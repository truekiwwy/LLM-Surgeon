[package]
name = "weight-surgeon"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "surgeon"
path = "src/main.rs"

[dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
clap = { version = "4.6.7", features = ["derive", "env"] }
ctrlc = "3.5.2"
half = { version = "2.7.1", features = ["std"] }
memmap2 = "0.9.12"
nvml-wrapper = "0.13.0"
rayon = "1.12.0"
safetensors = "0.8.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sysinfo = { version = "0.40.1", default-features = false, features = ["system"] }
thiserror = "2.0.21"
unicode-width = "0.2.3"

[dev-dependencies]
tempfile = "3.27.0"
