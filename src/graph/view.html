<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>surgeon graph 3D</title>
<!-- Generated by `surgeon graph --format html`: self-contained, no network access. -->
<style>
  :root {
    --bg: #0b0f19; --panel: rgba(15, 23, 42, 0.92); --line: #1e293b; --text: #e2e8f0;
    --muted: #94a3b8; --accent: #38bdf8; --changed: #e6550d; --input: #111827;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f8fafc; --panel: rgba(255, 255, 255, 0.94); --line: #cbd5e1; --text: #0f172a;
      --muted: #475569; --accent: #0369a1; --input: #ffffff;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  #view { position: absolute; inset: 0; width: 100%; height: 100%; cursor: grab; touch-action: none; }
  #view.dragging { cursor: grabbing; }
  .card { position: absolute; background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; padding: 10px 12px; }
  #controls { top: 12px; left: 12px; width: 300px; max-height: calc(100% - 24px); overflow: auto; }
  #panel { top: 12px; right: 12px; width: 330px; max-height: calc(100% - 24px); overflow: auto; }
  #legend { bottom: 12px; left: 12px; max-width: 300px; }
  #tip { position: absolute; pointer-events: none; padding: 3px 7px; border-radius: 4px;
    background: var(--panel); border: 1px solid var(--line); display: none; white-space: nowrap; }
  h1 { font-size: 14px; margin: 0 0 4px; word-break: break-all; }
  h2 { font-size: 12px; margin: 12px 0 6px; color: var(--muted); text-transform: uppercase;
    letter-spacing: 0.04em; }
  .muted { color: var(--muted); }
  label { display: block; margin: 6px 0 2px; color: var(--muted); }
  input[type=range] { width: 100%; }
  input[type=search], select { width: 100%; padding: 4px 6px; background: var(--input);
    color: var(--text); border: 1px solid var(--line); border-radius: 4px; font: inherit; }
  .row { display: flex; gap: 6px; align-items: center; }
  .row > * { flex: 1; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; margin-top: 4px; }
  .seg button { flex: 1; border: 0; background: transparent; color: var(--text); padding: 5px; font: inherit; cursor: pointer; }
  .seg button[aria-pressed=true] { background: var(--accent); color: #0b0f19; }
  .seg button:disabled { opacity: 0.4; cursor: not-allowed; }
  button.plain { background: var(--input); color: var(--text); border: 1px solid var(--line);
    border-radius: 4px; padding: 4px 8px; font: inherit; cursor: pointer; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  table { width: 100%; border-collapse: collapse; }
  td { padding: 2px 0; vertical-align: top; }
  td:first-child { color: var(--muted); padding-right: 8px; white-space: nowrap; }
  td:last-child { text-align: right; font-variant-numeric: tabular-nums; word-break: break-all; }
  .badge { display: inline-block; padding: 0 6px; border-radius: 9px; border: 1px solid var(--line); font-size: 11px; }
  .changed { color: var(--changed); }
  ul.plain { list-style: none; margin: 0; padding: 0; }
  ul.plain li { padding: 2px 0; cursor: pointer; }
  ul.plain li:hover { color: var(--accent); }
  .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
  .ramp { height: 10px; border-radius: 3px; margin: 4px 0 2px; }
  @media (max-width: 760px) {
    #controls { width: calc(100% - 24px); max-height: 38%; }
    #panel { top: auto; bottom: 12px; width: calc(100% - 24px); max-height: 34%; }
    #legend { display: none; }
  }
</style>
</head>
<body>
<canvas id="view" aria-label="Vue 3D du graphe de poids"></canvas>
<div id="tip" role="status"></div>

<div id="controls" class="card">
  <h1 id="title">surgeon graph</h1>
  <div id="subtitle" class="muted"></div>

  <h2>Vue</h2>
  <div class="seg" role="group" aria-label="Vue">
    <button type="button" id="view-abs" aria-pressed="true">Absolue</button>
    <button type="button" id="view-diff" aria-pressed="false">Diff (Δ)</button>
  </div>
  <label for="layout">Disposition</label>
  <select id="layout">
    <option value="layers">Colonne par couches</option>
    <option value="forces">Constellation 3D (forces)</option>
  </select>
  <label for="color-by">Couleur des nœuds (vue absolue)</label>
  <select id="color-by">
    <option value="role">Type de module</option>
    <option value="coupling">Intensité de couplage</option>
    <option value="erank">Rang effectif</option>
  </select>
  <label><input type="checkbox" id="only-changed"> Masquer ce qui n'a pas changé</label>

  <h2>Filtres</h2>
  <label for="layer-min">Couches : <span id="layer-text"></span></label>
  <div class="row">
    <input type="range" id="layer-min" min="0" value="0" aria-label="Première couche">
    <input type="range" id="layer-max" min="0" value="0" aria-label="Dernière couche">
  </div>
  <label for="coupling">Couplage minimal des arêtes : <span id="coupling-text"></span></label>
  <input type="range" id="coupling" min="0" max="1000" value="0">
  <label for="search">Recherche (id ou tenseur, Entrée pour centrer)</label>
  <input type="search" id="search" placeholder="L12.mlp_out, down_proj..." autocomplete="off">
  <div id="search-count" class="muted"></div>

  <h2>Caméra</h2>
  <div class="row">
    <button type="button" class="plain" id="reset">Réinitialiser (R)</button>
  </div>
  <div class="muted" style="margin-top:6px">Glisser : orbite · Maj+glisser ou clic droit : déplacement · Molette : zoom · Clic : inspecter</div>
</div>

<div id="panel" class="card" aria-live="polite"></div>
<div id="legend" class="card"></div>

<script id="graph-data" type="application/json">/*GRAPH_DATA*/null</script>
<script>
"use strict";
(function () {
  const report = JSON.parse(document.getElementById("graph-data").textContent);
  const $ = (id) => document.getElementById(id);
  if (!report || !report.nodes) {
    $("panel").textContent = "Aucune donnée de graphe.";
    return;
  }
  const diff = report.baseline_diff || null;
  const layers = report.global.layers;

  // ---------------------------------------------------------------- data
  const ROLE_COLOR = {
    embed: "#4c78a8", attn_out: "#f58518", q: "#b279a2", k: "#b279a2", v: "#b279a2",
    gate: "#e45756", up: "#e45756", mlp_out: "#54a24b", lm_head: "#72b7b2",
  };
  const ROLE_LABEL = [
    ["embed", "embed_tokens"], ["q", "q/k/v_proj"], ["attn_out", "o_proj"],
    ["gate", "gate/up_proj"], ["mlp_out", "down_proj"], ["lm_head", "lm_head"],
  ];
  // Position on the ring of a layer: each stage of the causal order gets its own angle.
  const ROLE_ANGLE = { q: 0, k: 2.09, v: 4.19, attn_out: 1.05, gate: 0.52, up: 3.67, mlp_out: 5.24 };
  const nodeDiff = new Map(diff ? diff.nodes.map((d) => [d.id, d]) : []);
  const edgeDiff = new Map(diff ? diff.edges.map((d) => [d.source + "\u0000" + d.target, d]) : []);

  const maxSeq = Math.max(1, ...report.nodes.map((n) => n.seq));
  const nodes = report.nodes.map((n) => {
    const ring = n.role === "embed" || n.role === "lm_head" ? 0 : 3.2 + 0.45 * ((n.expert || 0) % 8);
    const angle = (ROLE_ANGLE[n.role] || 0) + 0.39 * (n.expert || 0) + 0.18 * (n.layer || 0);
    const m = n.metrics;
    const column = [ring * Math.cos(angle), (n.seq - maxSeq / 2) * 0.9, ring * Math.sin(angle)];
    return {
      src: n, id: n.id,
      // x/y/z is the position drawn now; target is where the active layout wants it.
      home: { layers: column, forces: null }, target: column, x: column[0], y: column[1], z: column[2],
      size: Math.min(2.4, Math.max(0.45, 0.45 + 0.35 * Math.log10(1 + Math.max(0, m.frobenius_norm)))),
      erank: (m.erank_energy_lower + m.erank_energy_upper) / 2,
      diff: nodeDiff.get(n.id) || null,
      coupling: 0, edges: [],
      // Filters: embed sits with layer 0, the head with the last layer.
      layerKey: n.layer != null ? n.layer : n.role === "embed" ? 0 : Math.max(0, layers - 1),
    };
  });
  const byId = new Map(nodes.map((n) => [n.id, n]));
  const edges = [];
  for (const e of report.edges) {
    const a = byId.get(e.source), b = byId.get(e.target);
    if (!a || !b) continue;
    const edge = { src: e, a, b, diff: edgeDiff.get(e.source + "\u0000" + e.target) || null };
    edges.push(edge);
    a.edges.push(edge); b.edges.push(edge);
    if (!e.structural) {
      a.coupling = Math.max(a.coupling, e.coupling);
      b.coupling = Math.max(b.coupling, e.coupling);
    }
  }
  const maxOf = (values) => values.reduce((m, v) => (Number.isFinite(v) ? Math.max(m, v) : m), 0);
  const maxCoupling = maxOf(edges.map((e) => e.src.coupling));
  const maxWeight = maxOf(edges.map((e) => e.src.weight));
  const maxErank = maxOf(nodes.map((n) => n.erank));
  const maxRel = maxOf(nodes.map((n) => (n.diff ? Math.abs(n.diff.relative_change) : 0)));
  const maxEdgeDelta = maxOf(edges.map((e) => (e.diff ? Math.abs(e.diff.alignment_delta) : 0)));

  // ---------------------------------------------------------------- constellation layout
  // Fruchterman-Reingold in 3D: every pair repels, every edge pulls with a strength given by its
  // spectral coupling. No random source and a fixed iteration count, so one report always gives
  // the same constellation.
  function computeForces() {
    const N = nodes.length, K = 1.8, R = K * Math.cbrt(N);
    const index = new Map(nodes.map((n, i) => [n, i]));
    const links = edges.map((e) => [index.get(e.a), index.get(e.b),
      e.src.structural ? 0.5 : 0.2 + 0.8 * (maxCoupling ? e.src.coupling / maxCoupling : 0)]);
    const pos = new Float64Array(3 * N), disp = new Float64Array(3 * N);
    // Fibonacci sphere start: distinct points, no bias toward the layer column.
    for (let i = 0; i < N; i++) {
      const y = N > 1 ? 1 - (2 * i) / (N - 1) : 0, r = Math.sqrt(1 - y * y), a = i * 2.399963;
      pos.set([R * r * Math.cos(a), R * y, R * r * Math.sin(a)], 3 * i);
    }
    // shortcut: exact O(N^2) repulsion with a shrinking iteration budget, switch to Barnes-Hut
    // if reports with several thousand matrices become common.
    const iters = Math.min(300, Math.max(40, Math.floor(2e7 / (N * N))));
    for (let it = 0; it < iters; it++) {
      disp.fill(0);
      for (let i = 0; i < N; i++) {
        for (let j = i + 1; j < N; j++) {
          const dx = pos[3 * i] - pos[3 * j], dy = pos[3 * i + 1] - pos[3 * j + 1], dz = pos[3 * i + 2] - pos[3 * j + 2];
          const f = (K * K) / (dx * dx + dy * dy + dz * dz + 1e-6);
          disp[3 * i] += dx * f; disp[3 * i + 1] += dy * f; disp[3 * i + 2] += dz * f;
          disp[3 * j] -= dx * f; disp[3 * j + 1] -= dy * f; disp[3 * j + 2] -= dz * f;
        }
      }
      for (const [i, j, s] of links) {
        const dx = pos[3 * i] - pos[3 * j], dy = pos[3 * i + 1] - pos[3 * j + 1], dz = pos[3 * i + 2] - pos[3 * j + 2];
        const f = (s * Math.hypot(dx, dy, dz)) / K;
        disp[3 * i] -= dx * f; disp[3 * i + 1] -= dy * f; disp[3 * i + 2] -= dz * f;
        disp[3 * j] += dx * f; disp[3 * j + 1] += dy * f; disp[3 * j + 2] += dz * f;
      }
      const temp = 0.1 * R * (1 - it / iters) + 0.01;
      for (let i = 0; i < N; i++) {
        // Weak pull to the centre keeps disconnected parts in view.
        const gx = disp[3 * i] - 0.05 * pos[3 * i], gy = disp[3 * i + 1] - 0.05 * pos[3 * i + 1], gz = disp[3 * i + 2] - 0.05 * pos[3 * i + 2];
        const len = Math.hypot(gx, gy, gz) || 1, step = Math.min(len, temp) / len;
        pos[3 * i] += gx * step; pos[3 * i + 1] += gy * step; pos[3 * i + 2] += gz * step;
      }
    }
    const mean = [0, 1, 2].map((k) => { let s = 0; for (let i = 0; i < N; i++) s += pos[3 * i + k]; return s / N; });
    nodes.forEach((n, i) => { n.home.forces = [0, 1, 2].map((k) => pos[3 * i + k] - mean[k]); });
  }

  // ---------------------------------------------------------------- colours
  const SEQ = [[68, 1, 84], [59, 82, 139], [33, 145, 140], [94, 201, 98], [253, 231, 37]];
  const rgb = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
  function ramp(stops, t) {
    t = Math.min(1, Math.max(0, t)) * (stops.length - 1);
    const i = Math.min(stops.length - 2, Math.floor(t)), f = t - i;
    return stops[i].map((v, k) => Math.round(v + (stops[i + 1][k] - v) * f));
  }
  // Diverging: blue when the value went down, red when it went up, grey for no change.
  function diverging(value, max) {
    if (!max || !value) return [128, 128, 128];
    const t = Math.sqrt(Math.min(1, Math.abs(value) / max));
    const end = value < 0 ? [33, 102, 172] : [214, 39, 40];
    return [128, 128, 128].map((v, k) => Math.round(v + (end[k] - v) * t));
  }
  const hexRgb = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));

  // ---------------------------------------------------------------- state
  const state = {
    view: "abs", layout: "layers", colorBy: "role", onlyChanged: false,
    layerMin: 0, layerMax: Math.max(0, layers - 1), minCoupling: 0,
    query: "", selected: null, hover: null,
  };
  const cam = { yaw: 0.6, pitch: 0.35, dist: 10, tx: 0, ty: 0, tz: 0 };
  function resetCamera() {
    const radius = Math.max(4, ...nodes.map((n) => Math.hypot(...n.target)));
    Object.assign(cam, { yaw: 0.6, pitch: 0.35, dist: radius * 2.4, tx: 0, ty: 0, tz: 0 });
    redraw();
  }

  // Eases every node toward the target of the active layout; false once all have arrived.
  let animating = false, lastFrame = 0;
  function stepAnimation(now) {
    const dt = lastFrame ? Math.min(0.05, (now - lastFrame) / 1000) : 0.016;
    const k = 1 - Math.exp(-dt * 7);
    lastFrame = now;
    let moving = false;
    for (const n of nodes) {
      const t = n.target, dx = t[0] - n.x, dy = t[1] - n.y, dz = t[2] - n.z;
      if (Math.hypot(dx, dy, dz) < 1e-3) { [n.x, n.y, n.z] = t; continue; }
      n.x += dx * k; n.y += dy * k; n.z += dz * k;
      moving = true;
    }
    return moving;
  }
  function setLayout(layout) {
    if (layout === "forces" && nodes.length && !nodes[0].home.forces) computeForces();
    state.layout = layout;
    for (const n of nodes) n.target = n.home[layout];
    animating = true; lastFrame = 0;
    resetCamera();
    sync();
  }

  function isChanged(n) { return !!(n.diff && n.diff.changed); }
  function matches(n) {
    if (!state.query) return true;
    const q = state.query.toLowerCase();
    return n.id.toLowerCase().includes(q) || n.src.tensor.toLowerCase().includes(q);
  }
  function visible(n) {
    if (n.layerKey < state.layerMin || n.layerKey > state.layerMax) return false;
    if (state.view === "diff" && state.onlyChanged && !isChanged(n)) return false;
    return true;
  }
  function edgeVisible(e) {
    if (!visible(e.a) || !visible(e.b)) return false;
    if (!e.src.structural && e.src.coupling < state.minCoupling) return false;
    if (state.view === "diff" && state.onlyChanged && !(e.diff && e.diff.changed)) return false;
    return true;
  }
  function nodeColor(n) {
    if (state.view === "diff") {
      if (!n.diff) return [90, 90, 90];
      return diverging(n.diff.relative_change, maxRel);
    }
    if (state.colorBy === "coupling") return ramp(SEQ, maxCoupling ? n.coupling / maxCoupling : 0);
    if (state.colorBy === "erank") return ramp(SEQ, maxErank ? n.erank / maxErank : 0);
    return hexRgb(ROLE_COLOR[n.src.role] || "#999999");
  }
  function edgeColor(e) {
    if (e.src.structural) return [136, 136, 136];
    if (state.view === "diff") return diverging(e.diff ? e.diff.alignment_delta : 0, maxEdgeDelta);
    return ramp(SEQ, maxWeight ? Math.sqrt(e.src.weight / maxWeight) : 0);
  }

  // ---------------------------------------------------------------- projection
  const canvas = $("view"), ctx = canvas.getContext("2d");
  let W = 0, H = 0, focal = 1, projected = [];
  function resize() {
    const dpr = window.devicePixelRatio || 1;
    W = canvas.clientWidth; H = canvas.clientHeight;
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    focal = Math.min(W, H) * 1.1;
    redraw();
  }
  // View space: yaw around Y, then pitch around X; the camera sits at +dist on the view axis.
  function project(p) {
    const x = p.x - cam.tx, y = p.y - cam.ty, z = p.z - cam.tz;
    const cy = Math.cos(cam.yaw), sy = Math.sin(cam.yaw), cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
    const x1 = cy * x + sy * z, z1 = -sy * x + cy * z;
    const y1 = cp * y - sp * z1, z2 = sp * y + cp * z1;
    const depth = cam.dist - z2;
    if (depth < 0.05) return null;
    const s = focal / depth;
    return { x: W / 2 + x1 * s, y: H / 2 - y1 * s, s, depth };
  }
  function axes() {
    const cy = Math.cos(cam.yaw), sy = Math.sin(cam.yaw), cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
    return { right: [cy, 0, sy], up: [sp * sy, cp, -sp * cy] };
  }

  // ---------------------------------------------------------------- drawing
  let pending = false;
  function redraw() {
    if (pending) return;
    pending = true;
    requestAnimationFrame(draw);
  }
  function draw(now) {
    pending = false;
    if (animating) {
      animating = stepAnimation(now);
      if (animating) redraw();
    }
    ctx.clearRect(0, 0, W, H);
    const pos = new Map();
    for (const n of nodes) {
      if (visible(n)) {
        const p = project(n);
        if (p) pos.set(n, p);
      }
    }
    const searching = !!state.query;
    ctx.lineCap = "round";
    for (const e of edges) {
      if (!edgeVisible(e)) continue;
      const a = pos.get(e.a), b = pos.get(e.b);
      if (!a || !b) continue;
      const changed = e.diff && e.diff.changed;
      const dim = searching && !(matches(e.a) || matches(e.b));
      const strong = state.view === "diff" ? (changed ? 0.9 : 0.15) : 0.25 + 0.5 * (maxWeight ? e.src.weight / maxWeight : 0);
      ctx.strokeStyle = rgb(edgeColor(e), dim ? 0.06 : strong);
      ctx.lineWidth = state.view === "diff" && changed ? 2.6 : 1 + 1.5 * (maxWeight ? e.src.weight / maxWeight : 0);
      if (e.src.structural) ctx.setLineDash([4, 4]);
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      ctx.setLineDash([]);
    }
    projected = [...pos.entries()].sort((l, r) => r[1].depth - l[1].depth);
    for (const [n, p] of projected) {
      const r = Math.max(2, n.size * p.s * 0.12);
      p.r = r;
      const dim = searching && !matches(n);
      const fade = state.view === "diff" && !isChanged(n) ? 0.45 : 1;
      ctx.fillStyle = rgb(nodeColor(n), dim ? 0.12 : 0.92 * fade);
      ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2); ctx.fill();
      // Same rule as the DOT octagons: kurtosis above the threshold or an outlier channel.
      const outlier = n.src.metrics.kurtosis > report.parameters.kurtosis_threshold || n.src.metrics.channels.outliers.length > 0;
      if (n === state.selected || (state.view === "diff" && isChanged(n)) || outlier || (searching && !dim)) {
        ctx.lineWidth = n === state.selected ? 3 : 1.6;
        ctx.strokeStyle = n === state.selected ? "#38bdf8" : isChanged(n) ? "#e6550d" : outlier ? "#d62728" : "#fde047";
        ctx.stroke();
      }
      if (n === state.selected || n === state.hover || p.s > 160) {
        ctx.fillStyle = getComputedStyle(document.body).color;
        ctx.font = "11px system-ui, sans-serif";
        ctx.fillText(n.id, p.x + r + 3, p.y + 4);
      }
    }
  }

  // ---------------------------------------------------------------- panels
  const fmt = (v, d = 4) => v == null || !Number.isFinite(v) ? "-" : Math.abs(v) >= 1e5 || (v !== 0 && Math.abs(v) < 1e-3) ? v.toExponential(2) : Number(v.toFixed(d)).toString();
  const signed = (v, d = 4) => v == null ? "-" : (v > 0 ? "+" : "") + fmt(v, d);
  const pct = (v) => v == null ? "-" : (v > 0 ? "+" : "") + (v * 100).toFixed(3) + " %";
  function esc(text) {
    return String(text).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  }
  function rows(list) {
    return "<table>" + list.map(([k, v]) => `<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`).join("") + "</table>";
  }
  function showNode(n) {
    const s = n.src, m = s.metrics;
    let html = `<h1>${esc(s.id)}</h1><div class="muted">${esc(s.tensor)}</div>`;
    html += "<h2>Matrice</h2>" + rows([
      ["Rôle", `${s.role} (${s.kind})`], ["Couche", s.layer == null ? "-" : s.layer],
      ["Expert", s.expert == null ? "-" : s.expert], ["Dimensions", `${s.rows} × ${s.cols}`],
      ["dtype", s.dtype], ["Octets", s.weight_bytes.toLocaleString("fr-FR")],
    ]);
    html += "<h2>Spectre (certifié)</h2>" + rows([
      ["Rang SVD", m.rank],
      ["Rang effectif (énergie)", `${fmt(m.erank_energy_lower, 2)} à ${fmt(m.erank_energy_upper, 2)}`],
      ["Rang effectif L1 exact", fmt(m.erank_l1, 2)],
      ["σ1", `${fmt(m.sigma1)} [${fmt(m.sigma1_lower)} ; ${fmt(m.sigma1_upper)}]`],
      ["Rang stable", `${fmt(m.d_spec, 2)} [${fmt(m.d_spec_lower, 2)} ; ${fmt(m.d_spec_upper, 2)}]`],
      ["Norme de Frobenius", fmt(m.frobenius_norm)],
      ["Énergie captée", fmt(m.energy)], ["Énergie résiduelle", fmt(m.residual_energy)],
      ["Erreur relative", fmt(m.rel_error)],
    ]);
    html += "<h2>Flux résiduel et outliers</h2>" + rows([
      ["Alignement e_write", fmt(m.e_write)], ["Alignement e_read", fmt(m.e_read)],
      ["Kurtosis", fmt(m.kurtosis, 2)], ["Canaux outliers", m.channels.outliers.length ? m.channels.outliers.slice(0, 24).join(", ") + (m.channels.outliers.length > 24 ? " ..." : "") : "aucun"],
      ["Valeurs non finies", m.non_finite],
    ]);
    if (n.diff) {
      const d = n.diff;
      html += `<h2>Diff contre la référence ${d.changed ? '<span class="changed">modifié</span>' : ""}</h2>` + rows([
        ["Δ rang effectif", signed(d.effective_rank_delta, 3)], ["Δ norme (Frobenius)", signed(d.norm_delta)],
        ["Changement relatif", pct(d.relative_change)], ["Δ σ1", signed(d.sigma1_delta)],
      ]);
    } else if (diff) {
      html += '<h2>Diff</h2><div class="muted">Nœud absent de la référence.</div>';
    }
    const top = n.edges.filter((e) => !e.src.structural).sort((l, r) => r.src.weight - l.src.weight).slice(0, 6);
    if (top.length) {
      html += "<h2>Arêtes les plus fortes</h2>" + rows(top.map((e) => [
        (e.a === n ? "→ " + e.b.id : "← " + e.a.id),
        `${fmt(e.src.weight, 3)}${e.diff ? " (Δ " + signed(e.diff.alignment_delta, 3) + ")" : ""}`,
      ]));
    }
    $("panel").innerHTML = html;
  }
  function showOverview() {
    const g = report.global;
    let html = "<h1>Vue d'ensemble</h1>" + rows([
      ["Matrices", g.nodes], ["Arêtes", g.edges], ["Couches", g.layers], ["hidden", g.hidden],
      ["Canaux outliers", g.outlier_channels.length], ["Kurtosis max", fmt(g.kurtosis_max, 2)],
      ["Rang effectif moyen", `${fmt(g.mean_erank_energy_lower, 2)} à ${fmt(g.mean_erank_energy_upper, 2)}`],
    ]);
    if (diff) {
      html += "<h2>Diff contre la référence</h2>" + rows([
        ["Référence", diff.baseline], ["Source", diff.source], ["Empreinte", diff.baseline_hash_mode],
        ["Seuil", pct(diff.threshold).replace("+", "")],
        ["Matrices modifiées", `${diff.nodes_changed} / ${diff.nodes_compared}`],
        ["Arêtes modifiées", `${diff.edges_changed} / ${diff.edges_compared}`],
        ["Absentes de la référence", diff.only_in_model.length], ["Absentes du modèle", diff.only_in_baseline.length],
      ]);
      if (diff.warnings.length) html += '<div class="changed">' + diff.warnings.map(esc).join("<br>") + "</div>";
      if (diff.top_changed_layers.length) {
        html += '<h2>Couches les plus modifiées</h2><ul class="plain" id="top-layers">' + diff.top_changed_layers.map((l, i) =>
          `<li data-i="${i}" tabindex="0">${l.layer == null ? "embed / tête" : "Couche " + l.layer} · ${pct(l.max_relative_change).replace("+", "")} · ${esc(l.top_node)}</li>`).join("") + "</ul>";
      }
    }
    html += '<div class="muted" style="margin-top:8px">Cliquer un nœud pour l\'inspecter.</div>';
    $("panel").innerHTML = html;
    const list = $("top-layers");
    if (list) {
      const go = (ev) => {
        const li = ev.target.closest("li");
        if (li) focusNode(byId.get(diff.top_changed_layers[+li.dataset.i].top_node));
      };
      list.addEventListener("click", go);
      list.addEventListener("keydown", (ev) => { if (ev.key === "Enter") go(ev); });
    }
  }
  function updatePanel() { state.selected ? showNode(state.selected) : showOverview(); }

  function legendHtml() {
    if (state.view === "diff") {
      return "<b>Vue Diff</b><div class=\"ramp\" style=\"background:linear-gradient(90deg,#2166ac,#808080,#d62728)\"></div>" +
        '<div class="row muted"><span>baisse</span><span style="text-align:center">inchangé</span><span style="text-align:right">hausse</span></div>' +
        `<div class="muted">Nœuds : changement relatif de norme (max ${pct(maxRel).replace("+", "")}). Arêtes : Δ alignement. Contour orange : au-delà du seuil.</div>`;
    }
    if (state.colorBy === "role") {
      return "<b>Type de module</b><br>" + ROLE_LABEL.map(([r, l]) => `<span class="swatch" style="background:${ROLE_COLOR[r]}"></span>${l}`).join("<br>") +
        '<div class="muted">Taille : log de la norme de Frobenius. Contour rouge : kurtosis au-delà du seuil.</div>';
    }
    const what = state.colorBy === "coupling" ? `couplage max des arêtes (0 à ${fmt(maxCoupling, 2)})` : `rang effectif (0 à ${fmt(maxErank, 1)})`;
    return `<b>${what}</b><div class="ramp" style="background:linear-gradient(90deg,#440154,#3b528b,#21918c,#5ec962,#fde725)"></div>`;
  }

  function sync() {
    $("view-abs").setAttribute("aria-pressed", String(state.view === "abs"));
    $("view-diff").setAttribute("aria-pressed", String(state.view === "diff"));
    $("layout").value = state.layout;
    $("color-by").disabled = state.view === "diff";
    $("only-changed").disabled = state.view !== "diff";
    $("layer-text").textContent = `${state.layerMin} à ${state.layerMax}`;
    $("coupling-text").textContent = fmt(state.minCoupling, 3);
    const found = state.query ? nodes.filter(matches).length : 0;
    $("search-count").textContent = state.query ? `${found} nœud(s)` : "";
    $("legend").innerHTML = legendHtml();
    updatePanel();
    redraw();
  }
  function focusNode(n) {
    if (!n) return;
    state.selected = n;
    Object.assign(cam, { tx: n.target[0], ty: n.target[1], tz: n.target[2] });
    cam.dist = Math.min(cam.dist, 14);
    sync();
  }

  // ---------------------------------------------------------------- controls
  const short = report.model.path.split(/[\\/]/).filter(Boolean).pop() || report.model.path;
  $("title").textContent = short;
  document.title = short + " · surgeon graph 3D";
  $("subtitle").innerHTML = `${esc(report.model.architecture)} · ${report.global.nodes} matrices · ${report.global.edges} arêtes · ` +
    `<span class="badge" title="${esc(report.model.sha256)}">empreinte ${esc(report.model.hash_mode || "sha256")}</span>`;
  if (!diff) {
    $("view-diff").disabled = true;
    $("view-diff").title = "Relancer avec --baseline pour comparer";
  }
  $("view-abs").onclick = () => { state.view = "abs"; sync(); };
  $("view-diff").onclick = () => { if (diff) { state.view = "diff"; sync(); } };
  $("layout").onchange = (e) => setLayout(e.target.value);
  $("color-by").onchange =(e) => { state.colorBy = e.target.value; sync(); };
  $("only-changed").onchange = (e) => { state.onlyChanged = e.target.checked; sync(); };
  for (const id of ["layer-min", "layer-max"]) {
    const input = $(id);
    input.max = String(Math.max(0, layers - 1));
    input.value = id === "layer-min" ? "0" : input.max;
    input.oninput = () => {
      let lo = +$("layer-min").value, hi = +$("layer-max").value;
      if (lo > hi) { if (id === "layer-min") hi = lo; else lo = hi; }
      $("layer-min").value = lo; $("layer-max").value = hi;
      state.layerMin = lo; state.layerMax = hi;
      sync();
    };
  }
  $("coupling").oninput = (e) => { state.minCoupling = (+e.target.value / 1000) * maxCoupling; sync(); };
  $("search").oninput = (e) => { state.query = e.target.value.trim(); sync(); };
  $("search").onkeydown = (e) => { if (e.key === "Enter") focusNode(nodes.find((n) => visible(n) && matches(n))); };
  $("reset").onclick = () => { state.selected = null; resetCamera(); sync(); };
  window.addEventListener("keydown", (e) => {
    if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
    if (e.key === "r" || e.key === "R") { state.selected = null; resetCamera(); sync(); }
    if (e.key === "Escape") { state.selected = null; sync(); }
  });

  function pick(x, y) {
    for (let i = projected.length - 1; i >= 0; i--) {
      const [n, p] = projected[i];
      if (Math.hypot(p.x - x, p.y - y) <= (p.r || 3) + 4) return n;
    }
    return null;
  }
  let drag = null;
  canvas.addEventListener("contextmenu", (e) => e.preventDefault());
  canvas.addEventListener("pointerdown", (e) => {
    canvas.setPointerCapture(e.pointerId);
    drag = { x: e.clientX, y: e.clientY, moved: false, pan: e.shiftKey || e.button === 2 };
    canvas.classList.add("dragging");
  });
  canvas.addEventListener("pointermove", (e) => {
    const rect = canvas.getBoundingClientRect();
    if (!drag) {
      const n = pick(e.clientX - rect.left, e.clientY - rect.top);
      if (n !== state.hover) { state.hover = n; redraw(); }
      const tip = $("tip");
      tip.style.display = n ? "block" : "none";
      if (n) { tip.textContent = n.id; tip.style.left = e.clientX + 12 + "px"; tip.style.top = e.clientY + 12 + "px"; }
      return;
    }
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (Math.abs(dx) + Math.abs(dy) > 2) drag.moved = true;
    drag.x = e.clientX; drag.y = e.clientY;
    if (drag.pan) {
      const k = cam.dist / focal, { right, up } = axes();
      cam.tx -= (right[0] * dx - up[0] * dy) * k;
      cam.ty -= (right[1] * dx - up[1] * dy) * k;
      cam.tz -= (right[2] * dx - up[2] * dy) * k;
    } else {
      cam.yaw += dx * 0.008;
      cam.pitch = Math.max(-1.5, Math.min(1.5, cam.pitch + dy * 0.008));
    }
    redraw();
  });
  canvas.addEventListener("pointerup", (e) => {
    canvas.classList.remove("dragging");
    if (drag && !drag.moved) {
      const rect = canvas.getBoundingClientRect();
      state.selected = pick(e.clientX - rect.left, e.clientY - rect.top);
      sync();
    }
    drag = null;
  });
  canvas.addEventListener("wheel", (e) => {
    e.preventDefault();
    cam.dist = Math.max(0.5, cam.dist * Math.exp(e.deltaY * 0.0012));
    redraw();
  }, { passive: false });
  window.addEventListener("resize", resize);

  if (diff && diff.nodes_changed > 0) state.view = "diff";
  resize();
  resetCamera();
  sync();
})();
</script>
</body>
</html>
